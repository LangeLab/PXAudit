name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.architecture }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Python 3.12 suite across every supported system.
          - os: ubuntu-24.04
            architecture: x86_64
            python-version: "3.12"
            quality: true
            coverage: true
            coverage_upload: true
          - os: ubuntu-24.04-arm
            architecture: arm64
            python-version: "3.12"
            quality: false
            coverage: false
            coverage_upload: false
          - os: macos-15
            architecture: arm64
            python-version: "3.12"
            quality: false
            coverage: false
            coverage_upload: false
          - os: macos-15-intel
            architecture: x86_64
            python-version: "3.12"
            quality: false
            coverage: false
            coverage_upload: false
          - os: windows-2025
            architecture: x86_64
            python-version: "3.12"
            quality: false
            coverage: false
            coverage_upload: false
          - os: windows-11-arm
            architecture: arm64
            python-version: "3.12"
            quality: false
            coverage: false
            coverage_upload: false

          # Future Python versions stay on Ubuntu until cross-platform support
          # needs the additional matrix expansion.
          - os: ubuntu-24.04
            architecture: x86_64
            python-version: "3.13"
            quality: false
            coverage: true
            coverage_upload: false
          - os: ubuntu-24.04
            architecture: x86_64
            python-version: "3.14"
            quality: false
            coverage: true
            coverage_upload: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.architecture }}-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Verify runner architecture
        run: >-
          uv run python -c
          "import platform; actual=platform.machine().lower(); expected='${{ matrix.architecture }}';
          aliases={'x86_64': {'x86_64', 'amd64'}, 'arm64': {'arm64', 'aarch64'}};
          assert actual in aliases[expected], (expected, actual); print(f'runner={actual}')"

      - name: Lint
        if: matrix.quality == true
        run: uv run ruff check src/ tests/

      - name: Check formatting
        if: matrix.quality == true
        run: uv run ruff format --check src/ tests/

      - name: Check types
        if: matrix.quality == true
        run: uv run mypy src/ tests/

      - name: Run offline suite
        run: uv run pytest ${{ matrix.coverage && '--cov-report=xml' || '--no-cov' }}

      - name: Upload coverage to Codecov
        if: matrix.coverage_upload == true && github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: offline
          token: ${{ secrets.CODECOV_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Export locked dependencies
        run: >-
          uv export --frozen --all-extras --no-emit-project
          --output-file "${{ runner.temp }}/requirements-audit.txt"

      - name: Audit locked dependencies
        run: >-
          uv tool run --from pip-audit==2.10.0 pip-audit
          --require-hashes --requirement "${{ runner.temp }}/requirements-audit.txt"
