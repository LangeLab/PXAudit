name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: quality-3.12

      - name: Set up Python 3.12
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Check types
        run: uv run mypy src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            coverage: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run offline suite
        run: uv run pytest ${{ matrix.coverage && '--cov-report=xml' || '' }}

      - name: Upload coverage to Codecov
        if: matrix.coverage == true && github.event_name == 'push'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: offline
          token: ${{ secrets.CODECOV_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Export locked dependencies
        run: >-
          uv export --frozen --all-extras --no-emit-project
          --output-file "${{ runner.temp }}/requirements-audit.txt"

      - name: Audit locked dependencies
        run: >-
          uv tool run --from pip-audit==2.10.0 pip-audit
          --require-hashes --requirement "${{ runner.temp }}/requirements-audit.txt"
