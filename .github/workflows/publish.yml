name: Publish package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Exact release tag, for example v0.6.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

jobs:
  build:
    name: Build ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }} distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: publish

      - name: Validate release ref and package version
        env:
          RELEASE_REF: ${{ env.RELEASE_REF }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "publishing requires an exact vX.Y.Z tag: $RELEASE_REF" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF" || {
            echo "release tag does not exist: $RELEASE_REF" >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$RELEASE_REF^{commit}")" ]] || {
            echo "checkout is not at the requested release tag: $RELEASE_REF" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            git fetch --no-tags origin main
            main_sha="$(git rev-parse origin/main)"
            [[ "$(git rev-parse "$RELEASE_REF^{commit}")" == "$main_sha" ]] || {
              echo "automatic publication requires the tag to point at current main: tag=$(git rev-parse "$RELEASE_REF^{commit}") main=$main_sha" >&2
              exit 1
            }
          fi
          version="${RELEASE_REF#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          [[ "$package_version" == "$version" ]] || {
            echo "tag version $version does not match pyproject.toml version $package_version" >&2
            exit 1
          }
          bash .github/scripts/changelog_section.sh CHANGELOG.md "$version" > /dev/null

      - name: Verify lockfile
        run: uv lock --check

      - name: Clean distribution directory
        run: rm -rf dist

      - name: Build distributions
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pxaudit-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/pxaudit/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: pxaudit-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
