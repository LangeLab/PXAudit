name: Live PRIDE verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-pride-verification
  cancel-in-progress: false

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PXAUDIT_LIVE_RECORD: ${{ github.workspace }}/live-verification.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: live-3.12

      - name: Set up Python 3.12
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run live PRIDE integration tests
        run: uv run pytest -m integration -v --no-cov

      - name: Upload live verification record
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-pride-verification-${{ github.run_id }}
          path: ${{ env.PXAUDIT_LIVE_RECORD }}
          if-no-files-found: error
          retention-days: 90
