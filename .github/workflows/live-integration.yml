name: Live PRIDE verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-pride-verification
  cancel-in-progress: false

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PXAUDIT_LIVE_RECORD: ${{ github.workspace }}/live-verification.json

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-suffix: live-3.12

      - name: Set up Python 3.12
        run: uv python pin 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev --all-extras

      - name: Run live PRIDE integration tests
        run: uv run pytest -m integration -v --no-cov

      - name: Upload live verification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-pride-verification-${{ github.run_id }}
          path: ${{ env.PXAUDIT_LIVE_RECORD }}
          if-no-files-found: error
          retention-days: 90
