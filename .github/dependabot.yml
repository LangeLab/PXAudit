version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: monthly

updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies

  - package-ecosystem: pre-commit
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: monthly-dependencies
