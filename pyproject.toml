[project]
name = "pxaudit"
version = "0.5.0"
description = "Proteomics Exchange metadata audit tool"
authors = [
    { name = "eneskemalergin", email = "eneskemalergin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.3",
    "pandas>=3.0",
    "requests>=2.33.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
report = [
    "jinja2>=3.1",
    "matplotlib>=3.8",
]

[project.scripts]
pxaudit = "pxaudit.cli:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/pxaudit/report.py" = ["E501"]
"tests/test_report.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=pxaudit --cov-report=term-missing -m 'not integration'"
markers = [
    "component: L1 workflow using controlled real components and mocked external services",
    "recorded: L2 contract using a reviewed, sanitized PRIDE response fixture",
    "integration: L3 test requiring live PRIDE API access",
]

[tool.coverage.run]
source = ["pxaudit"]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"
