repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [src/, tests/]
        additional_dependencies:
          - pandas-stubs>=3.0
          - types-requests>=2.32
          - click>=8.3.1
          - pytest>=9.0.2

